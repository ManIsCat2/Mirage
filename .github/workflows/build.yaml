name: Build Mirage

on:
    workflow_dispatch:
    push:

jobs:
    build-linux:
        strategy:
          matrix:
            arch:
              - name: x86_64
                runner: ubuntu-24.04
                cxx: g++
                bits32: 0
              - name: ARM
                runner: ubuntu-24.04-arm
                cxx: arm-linux-gnueabihf-g++
                bits32: 1
              - name: ARM64
                runner: ubuntu-24.04-arm
                cxx: aarch64-linux-gnu-g++
                bits32: 0
        runs-on: ${{ matrix.arch.runner }}
        name: Linux ${{ matrix.arch.name }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install -y build-essential g++-arm-linux-gnueabihf g++-aarch64-linux-gnu zlib1g-dev
                if [ "${{ matrix.arch.name }}" == "ARM" ]; then
                    sudo dpkg --add-architecture armhf
                    sudo apt update
                    sudo apt install -y zlib1g-dev:armhf
                fi

            - name: Build
              run: make CXX=${{ matrix.arch.cxx }} BITS_32=${{ matrix.arch.bits32 }} -j12

            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                name: mirage-linux-${{ matrix.arch.name }}
                path: ./build/Mirage
    
    build-windows:
        strategy:
          matrix:
            arch:
              - name: Win64
                sys: mingw64
                env: x86_64
        
        name: Windows ${{ matrix.arch.name }}
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: msys2/setup-msys2@v2
              with:
                msystem: ${{ matrix.arch.sys }}
                update: true
                install: >
                    make
                    mingw-w64-${{ matrix.arch.env }}-gcc
                    mingw-w64-${{ matrix.arch.env }}-zlib

            - name: Build
              run: make -j12

            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                name: mirage-windows-${{ matrix.arch.env }}
                path: ./build/Mirage.exe